[project]
name = "codeatlas-backend"
version = "0.4.1"
description = "CodeAtlas analysis API: secure ZIP import, repository scanning and structure statistics."
requires-python = ">=3.11"
license = "AGPL-3.0-only"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
filterwarnings = [
    # Starlette 1.x prefers httpx2 for its TestClient; httpx still works and is what FastAPI documents.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "e2e: browser-level end-to-end tests (need Playwright Chromium and the built frontend CSS)",
]
